name: Multi-OS Release Packaging Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package Linux Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils libasound2-dev libudev-dev pkg-config
          sudo curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage || true
          sudo chmod +x /usr/local/bin/appimagetool 2>/dev/null || true

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Unified Phonon Binary (Release Mode)
        run: |
          cargo build --release -p phonon-cli

      - name: Determine Packaging Version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref }}" != refs/tags/rolling ]]; then
            V="${{ github.ref_name }}"
            V="${V#v}"
            echo "version=${V}" >> $GITHUB_OUTPUT
          else
            echo "version=0.1.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Execute Linux Release Packaging Pipeline
        run: |
          bash packaging/build_packages.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows Assets (EXE Wizard & MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Packaging Version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref }}" != refs/tags/rolling ]]; then
            V="${{ github.ref_name }}"
            V="${V#v}"
            echo "version=${V}" >> $GITHUB_OUTPUT
          else
            echo "version=0.1.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Unified Phonon Windows Binary
        run: |
          cargo build --release -p phonon-cli --target x86_64-pc-windows-msvc

      - name: Prepare Windows Staging Directory
        shell: bash
        run: |
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-msvc/release/phonon.exe dist/phonon.exe
          cp target/x86_64-pc-windows-msvc/release/phonon.exe dist/windows/phonon.exe

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Inno Setup Interactive EXE Wizard
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DMyAppVersion="${{ steps.ver.outputs.version }}" packaging/windows/inno_setup.iss

      - name: Install WiX Toolset
        continue-on-error: true
        run: |
          dotnet tool install --global wix --version 4.0.5 || dotnet tool install --global wix || true

      - name: Build Enterprise MSI Installer
        shell: pwsh
        continue-on-error: true
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 2>$null || true
          wix build packaging/windows/phonon.wxs `
            -d BinSourceDir="dist/windows" `
            -d DocSourceDir="." `
            -d PackagingDir="packaging/windows" `
            -ext WixToolset.UI.wixext `
            -o dist/phonon-${{ steps.ver.outputs.version }}-x64.msi || true

      - name: Create Portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/windows/phonon.exe, README.md, LICENSE -DestinationPath dist/phonon-v${{ steps.ver.outputs.version }}-x86_64-pc-windows-msvc.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          if-no-files-found: warn

  build-macos:
    name: Build & Package macOS Assets (DMG & PKG Wizard)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Packaging Version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* && "${{ github.ref }}" != refs/tags/rolling ]]; then
            V="${{ github.ref_name }}"
            V="${V#v}"
            echo "version=${V}" >> $GITHUB_OUTPUT
          else
            echo "version=0.1.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Unified Phonon macOS Binary
        run: |
          cargo build --release -p phonon-cli --target aarch64-apple-darwin

      - name: Assemble Phonon Studio.app Bundle
        run: |
          bash packaging/macos/build_app_bundle.sh target/aarch64-apple-darwin/release/phonon

      - name: Build Styled Drag-and-Drop DMG
        run: |
          bash packaging/macos/create_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Build Guided Multi-Step PKG Wizard
        run: |
          mkdir -p dist/pkg-staging
          pkgbuild --root "dist/macos/Phonon Studio.app" \
                   --install-location "/Applications/Phonon Studio.app" \
                   --scripts packaging/macos/scripts \
                   --identifier net.aerovex.phonon.app \
                   --version "${{ steps.ver.outputs.version }}" \
                   dist/pkg-staging/phonon-app.pkg

          productbuild --distribution packaging/macos/distribution.xml \
                       --package-path dist/pkg-staging \
                       --resources packaging/macos \
                       "dist/Phonon-${{ steps.ver.outputs.version }}.pkg" || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz
          if-no-files-found: warn

  release:
    name: Publish Multi-OS GitHub Release
    if: always() && !cancelled() && needs.build-linux.result == 'success'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Compute Cryptographic SHA256SUMS Manifest
        run: |
          cd all-dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name "SHA256SUMS" ! -name ".*" -exec sha256sum {} + | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Update Rolling Continuous Pre-Release (Tracks Latest Commit)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: all-dist/*
          tag_name: rolling
          target_commitish: ${{ github.sha }}
          name: "Phonon Continuous Development Build (0.1.0-dev)"
          body: |
            Automated continuous development release tracking the latest commit (`${{ github.sha }}`).
            This rolling pre-release contains the latest development packages:
            - Linux: Debian (`phonon_0.1.0-dev_amd64.deb`), tarball (`phonon-v0.1.0-dev-x86_64-unknown-linux-gnu.tar.gz`)
            - Windows: Inno Setup (`phonon-setup-0.1.0-dev-x64.exe`), ZIP (`phonon-v0.1.0-dev-x86_64-pc-windows-msvc.zip`)
            - macOS: Apple Silicon DMG (`Phonon-0.1.0-dev.dmg`), PKG (`Phonon-0.1.0-dev.pkg`)
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official Tagged Release (If Tag Pushed)
        if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/rolling'
        uses: softprops/action-gh-release@v2
        with:
          files: all-dist/*
          name: "Phonon Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
