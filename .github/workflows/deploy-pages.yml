name: Deploy GitHub Pages (Docs & Studio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/docs/package.json
            web/studio/package.json

      - name: Build WebAssembly Phonon Studio Engine
        run: |
          cargo build --release -p phonon-gui --target wasm32-unknown-unknown
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar -xz
          mkdir -p web/studio/public/wasm
          ./wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/phonon_gui.wasm --out-dir web/studio/public/wasm --target web --no-typescript

      - name: Build Web CAD Studio (/studio)
        run: |
          cd web/studio
          npm ci
          npm run build

      - name: Build VitePress Docs (/)
        run: |
          cd web/docs
          npm ci
          npm run build

      - name: Assemble Static Site with CNAME
        run: |
          mkdir -p web/public_dist
          cp -r web/docs/.vitepress/dist/* web/public_dist/
          mkdir -p web/public_dist/studio
          cp -r web/studio/dist/* web/public_dist/studio/
          echo "phonon.aerovex.net" > web/public_dist/CNAME
          touch web/public_dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/public_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
