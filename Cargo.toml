[workspace]
resolver = "2"
members = [
    "crates/phonon-core",
    "crates/phonon-models",
    "crates/phonon-solver",
    "crates/phonon-thermal",
    "crates/phonon-netlist",
    "crates/phonon-cli",
    "crates/phonon-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aerovex Engineers <dev@aerovex.com>"]
license = "MIT"
repository = "https://github.com/aerovexhq/phonon"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
proptest = "1.6"
approx = "0.5"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 2
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 16
panic = "abort"
incremental = false


