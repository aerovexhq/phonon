<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="phononBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="packetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="phononGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="256" height="256" rx="52" fill="url(#phononBg)" stroke="#1e293b" stroke-width="3" />

  <!-- 2D Semiconductor Crystal Lattice Grid -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="3,4" opacity="0.6">
    <line x1="48" y1="64" x2="208" y2="64" />
    <line x1="48" y1="96" x2="208" y2="96" />
    <line x1="48" y1="128" x2="208" y2="128" />
    <line x1="48" y1="160" x2="208" y2="160" />
    <line x1="48" y1="192" x2="208" y2="192" />

    <line x1="64" y1="48" x2="64" y2="208" />
    <line x1="96" y1="48" x2="96" y2="208" />
    <line x1="128" y1="48" x2="128" y2="208" />
    <line x1="160" y1="48" x2="160" y2="208" />
    <line x1="192" y1="48" x2="192" y2="208" />
  </g>

  <!-- Concentric Phonon Wavefronts -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.25" />
  <circle cx="128" cy="128" r="68" fill="none" stroke="url(#waveGrad)" stroke-width="2.0" opacity="0.45" />
  <circle cx="128" cy="128" r="46" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.70" />

  <!-- Quantum Acoustic Sinusoidal Displacement Waves (Traversing wavepacket) -->
  <path d="M 40 128 C 62 68, 84 188, 106 128 C 128 68, 150 188, 172 128 C 194 68, 216 188, 226 128"
        fill="none" stroke="url(#packetGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#phononGlow)" />

  <path d="M 40 128 C 62 170, 84 86, 106 128 C 128 170, 150 86, 172 128 C 194 170, 216 86, 226 128"
        fill="none" stroke="url(#waveGrad)" stroke-width="2.0" stroke-linecap="round" opacity="0.5" />

  <!-- Crystal Lattice Atomic Nodes -->
  <circle cx="64" cy="64" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="96" cy="64" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="128" cy="64" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="160" cy="64" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="192" cy="64" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />

  <circle cx="64" cy="96" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="96" cy="96" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="128" cy="96" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="160" cy="96" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="192" cy="96" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />

  <circle cx="64" cy="128" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="106" cy="128" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="150" cy="128" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="192" cy="128" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />

  <circle cx="64" cy="160" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="96" cy="160" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="128" cy="160" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="160" cy="160" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="192" cy="160" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />

  <circle cx="64" cy="192" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="96" cy="192" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="128" cy="192" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="160" cy="192" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />
  <circle cx="192" cy="192" r="3.5" fill="#475569" stroke="#64748b" stroke-width="1" />

  <!-- Central Acoustic Energy Wavepacket Core -->
  <circle cx="128" cy="128" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="128" cy="128" r="7" fill="#38bdf8" />
</svg>
