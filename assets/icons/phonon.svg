<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sharp Square Container, Pure Black -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- Left Pins -->
  <rect x="76" y="186" width="60" height="22" fill="#ffffff" />
  <rect x="76" y="245" width="60" height="22" fill="#ffffff" />
  <rect x="76" y="304" width="60" height="22" fill="#ffffff" />
  
  <!-- Right Pins -->
  <rect x="376" y="186" width="60" height="22" fill="#ffffff" />
  <rect x="376" y="245" width="60" height="22" fill="#ffffff" />
  <rect x="376" y="304" width="60" height="22" fill="#ffffff" />
  
  <!-- Top Pins -->
  <rect x="186" y="76" width="22" height="60" fill="#ffffff" />
  <rect x="245" y="76" width="22" height="60" fill="#ffffff" />
  <rect x="304" y="76" width="22" height="60" fill="#ffffff" />
  
  <!-- Bottom Pins -->
  <rect x="186" y="376" width="22" height="60" fill="#ffffff" />
  <rect x="245" y="376" width="22" height="60" fill="#ffffff" />
  <rect x="304" y="376" width="22" height="60" fill="#ffffff" />
  
  <!-- Middle Square Package Frame -->
  <rect x="136" y="136" width="240" height="240" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="miter" />
  
  <!-- Contained Wave inside -->
  <path d="M 172 256
           L 194 256
           C 216 256, 216 196, 238 196
           C 260 196, 260 316, 282 316
           C 304 316, 304 256, 326 256
           L 340 256"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="square" stroke-linejoin="round" />
</svg>
