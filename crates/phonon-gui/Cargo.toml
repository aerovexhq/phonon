[package]
name = "phonon-gui"
description = "GPU-accelerated native CAD interface, interactive schematic capture, and virtual oscilloscope for Phonon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
phonon-core = { path = "../phonon-core" }
phonon-models = { path = "../phonon-models" }
phonon-solver = { path = "../phonon-solver" }
phonon-thermal = { path = "../phonon-thermal" }
phonon-netlist = { path = "../phonon-netlist" }

eframe = { workspace = true, features = ["glow"] }
egui = { workspace = true }
egui_plot = { workspace = true }
thiserror = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[[bin]]
name = "phonon-gui"
path = "src/main.rs"
