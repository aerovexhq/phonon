<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Metamaterial lattice grid -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6">
    <line x1="96" y1="128" x2="416" y2="128" />
    <line x1="96" y1="192" x2="416" y2="192" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="320" x2="416" y2="320" />
    <line x1="96" y1="384" x2="416" y2="384" />

    <line x1="128" y1="96" x2="128" y2="416" />
    <line x1="192" y1="96" x2="192" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="320" y1="96" x2="320" y2="416" />
    <line x1="384" y1="96" x2="384" y2="416" />
  </g>

  <!-- Concentric Phonon Wavefronts -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.25" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.45" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#waveGrad)" stroke-width="4" opacity="0.75" />

  <!-- Acoustic Standing Wave & Dispersion Curve (Sine curves) -->
  <path d="M 86 256 C 128 140, 170 372, 212 256 C 254 140, 296 372, 338 256 C 380 140, 422 372, 446 256"
        fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Topological Acoustic Cavity Node -->
  <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="256" r="12" fill="#38bdf8" />

  <!-- Distributed Quantum Interconnect Nodes -->
  <circle cx="128" cy="256" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
  <circle cx="212" cy="256" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
  <circle cx="338" cy="256" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
  <circle cx="384" cy="256" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="3" />

  <circle cx="256" cy="128" r="8" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
  <circle cx="256" cy="384" r="8" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
</svg>
